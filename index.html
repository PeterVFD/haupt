<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Meine Startseite</title>


<style>
  body {
    font-family: Arial, sans-serif;
    padding: 38px;
    text-align: center;

    /* Hintergrundbild */
    background-image: url("HUB.png");
    background-size: cover;         /* Bild füllt ganze Seite */
    background-position: center;    /* mittig ausrichten */
    background-repeat: no-repeat;   /* nicht wiederholen */
    background-attachment: fixed;   /* bleibt beim Scrollen stehen */

    margin: 0;
    min-height: 100vh;
  }

  .overlay {
    background: rgba(255, 255, 255, 0.75); /* leichter Weiß-Schleier */
    min-height: 100vh;
    padding: 30px;
  }

  .container {
    width: 300px;
    margin: 0 auto;
  }


  .btn {
    display: block;        /* untereinander */
    width: 100%;           /* alle gleich breit */
    margin: 10px 0;
    padding: 12px;
    background: #0066cc;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    box-sizing: border-box; /* verhindert Breitenfehler */
  }

  .btn:hover {
    background: #004c99;
  }
</style>
</head>

<body>
  <h1>Meine Helfer-Seiten</h1>

  <a class="btn" href="https://petervfd.github.io/Briefe/" target="_blank" widt=85>schreibe Briefe</a>
  <a class="btn" href="https://petervfd.github.io/Tarif/"target="_blank">Checke den Tarif</a>
  <a class="btn" href="https://petervfd.github.io/Kosten/"target="_blank">Zahlungs-Aufstellung</a>
  <a class="btn" href="https://petervfd.github.io/Gehalt/"target="_blank">berechne Dein Gehalt</a>
  <a class="btn" href="https://petervfd.github.io/Schicht/"target="_blank">Abbau/Split/Tausch</a>
  <a class="btn" href="https://petervfd.github.io/Pflicht/"target="_blank">errechne Deine Präsenz</a>
</body>
</html>
