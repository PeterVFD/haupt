body {

}

.container {
  background: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 15px;
  display: inline-block;
}

.btn {
  display: block;
  width: 250px;
  margin: 10px auto;
  padding: 12px;
  background: #0066cc;
  color: white;
  text-decoration: none;
  border-radius: 8px;
}

.btn:hover {
  background: #004c99;
}
</style>

<script>
// 👉 Passwort festlegen
const PASSWORT = "vodafone2026";

// 👉 Einmal prüfen beim Laden
window.onload = function() {
  let eingabe = prompt("Bitte Passwort eingeben:");

  if (eingabe !== PASSWORT) {
    document.body.innerHTML = "<h2>Zugriff verweigert</h2>";
  }
}
</script>
