<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meine Startseite</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url("HUB.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      min-height: 100vh;
    }

    .overlay {
      background: rgba(255, 255, 255, 0.78);
      min-height: 100vh;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 10px;
      margin-bottom: 25px;
      color: #1f2937;
      font-size: 32px;
    }

    .container {
      width: 340px;
      max-width: 100%;
      margin: 0 auto;
    }

    .panel {
      background: rgba(255,255,255,0.92);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    }

    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .btn {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      background: #0066cc;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      box-sizing: border-box;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .btn:hover {
      background: #004c99;
    }

    .btn-secondary {
      background: #6b7280;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .btn-danger {
      background: #b42318;
    }

    .btn-danger:hover {
      background: #8f1d13;
    }

    .status-box,
    .info-box,
    .error-box {
      margin-top: 15px;
      background: rgba(255,255,255,0.92);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      color: #374151;
      min-height: 20px;
      word-break: break-word;
    }

    .error-box {
      color: #b42318;
      display: none;
    }

    #appArea {
      display: none;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Meine Helfer-Seiten</h1>

    <div class="container">
      <div class="panel" id="loginPanel">
        <input type="password" id="passwordInput" placeholder="Kennwort eingeben" />
        <button class="btn" onclick="checkPassword()">Anmelden</button>
        <div class="error-box" id="errorBox">Falsches Kennwort.</div>
      </div>

      <div id="appArea">
        <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/Briefe/', 'briefe')">schreibe Briefe</button>
        <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/Tarif/', 'tarif')">Checke den Tarif</button>
        <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/Kosten/', 'kosten')">Zahlungs-Aufstellung</button>
        <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/Gehalt/', 'gehalt')">berechne Dein Gehalt</button>
        <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/Schicht/', 'schicht')">Abbau/Split/Tausch</button>
        <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/Pflicht/', 'pflicht')">errechne Deine Präsenz</button>
        <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/TA_SU/', 'ta_su')">TA-Suche</button>

        <button class="btn btn-secondary" onclick="showSessionInfo()">aktive Freigaben anzeigen</button>
        <button class="btn btn-danger" onclick="resetSession()">Freigaben zurücksetzen</button>

        <div class="status-box" id="status">Bereit.</div>

        <div class="info-box">
          Zugriff auf die Unterseiten nur nach Kennwort über diese Hauptseite.<br>
          Die Anmeldung und Freigabe gelten jeweils 15 Minuten.
        </div>
      </div>
    </div>
  </div>

  <script>
    const HUB_PASSWORD = "1234"; // <<< HIER DEIN PASSWORT EINTRAGEN
    const ACCESS_KEY = "vf2026";
    const SESSION_MINUTES = 15;

    // absichtlich neue Key-Namen, damit alte Browserwerte ignoriert werden
    const STORAGE_KEY = "hubProtectedAccess_v3";
    const LOGIN_KEY = "hubLoginUntil_v3";

    function now() {
      return Date.now();
    }

    function getLoginUntil() {
      return parseInt(localStorage.getItem(LOGIN_KEY) || "0", 10);
    }

    function isLoggedIn() {
      return getLoginUntil() > now();
    }

    function setLogin() {
      const until = now() + SESSION_MINUTES * 60 * 1000;
      localStorage.setItem(LOGIN_KEY, String(until));
    }

    function clearLogin() {
      localStorage.removeItem(LOGIN_KEY);
    }

    function loadAccessData() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch (e) {
        return {};
      }
    }

    function saveAccessData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function cleanupExpired(data) {
      const current = now();
      for (const key in data) {
        if (!data[key] || data[key] < current) {
          delete data[key];
        }
      }
      return data;
    }

    function showApp() {
      document.getElementById("loginPanel").style.display = "none";
      document.getElementById("appArea").style.display = "block";
      document.getElementById("errorBox").style.display = "none";
    }

    function showLogin() {
      document.getElementById("loginPanel").style.display = "block";
      document.getElementById("appArea").style.display = "none";
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const errorBox = document.getElementById("errorBox");

      if (input === HUB_PASSWORD) {
        setLogin();
        showApp();
        setStatus("Kennwort korrekt. Zugriff freigegeben.");
        errorBox.style.display = "none";
      } else {
        errorBox.style.display = "block";
        setStatus("Anmeldung fehlgeschlagen.");
      }
    }

    function openProtectedPage(baseUrl, pageId) {
      if (!isLoggedIn()) {
        clearLogin();
        setStatus("Bitte zuerst Kennwort eingeben.");
        showLogin();
        return;
      }

      const expires = now() + SESSION_MINUTES * 60 * 1000;

      let data = loadAccessData();
      data = cleanupExpired(data);
      data[pageId] = expires;
      saveAccessData(data);

      const url = new URL(baseUrl);
      url.searchParams.set("access", ACCESS_KEY);
      url.searchParams.set("page", pageId);

      window.open(url.toString(), "_blank");
      setStatus("Freigabe gesetzt für: " + pageId + " (" + SESSION_MINUTES + " Minuten)");
    }

    function resetSession() {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(LOGIN_KEY);
      document.getElementById("passwordInput").value = "";
      setStatus("Kennwort-Status und Freigaben wurden zurückgesetzt.");
      showLogin();
    }

    function showSessionInfo() {
      const loginUntil = getLoginUntil();
      let data = loadAccessData();
      data = cleanupExpired(data);
      saveAccessData(data);

      const entries = Object.entries(data);
      const loginText = loginUntil > now()
        ? "Haupt-Anmeldung bis " + new Date(loginUntil).toLocaleTimeString("de-DE")
        : "Keine aktive Haupt-Anmeldung";

      if (entries.length === 0) {
        setStatus(loginText + " | Keine aktiven Freigaben vorhanden.");
        return;
      }

      const lines = entries.map(([page, expires]) => {
        return page + " bis " + new Date(expires).toLocaleTimeString("de-DE");
      });

      setStatus(loginText + " | Aktive Freigaben: " + lines.join(" | "));
    }

    document.getElementById("passwordInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        checkPassword();
      }
    });

    // Startzustand
    if (isLoggedIn()) {
      showApp();
      showSessionInfo();
    } else {
      clearLogin();
      showLogin();
    }
  </script>
</body>
</html>
``
