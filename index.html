<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tool-Hub</title>

  <style>
    :root {
      --primary: #0066cc;
      --primary-hover: #004c99;
      --secondary: #6b7280;
      --secondary-hover: #4b5563;
      --tool: #0f766e;
      --tool-hover: #0d5f59;
      --card-bg: rgba(255, 255, 255, 0.90);
      --text: #1f2937;
      --muted: #6b7280;
      --ok-bg: #eef2ff;
      --ok-text: #1e3a8a;
      --err-bg: #fef2f2;
      --err-text: #991b1b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background-image: url("./HUB.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .overlay {
      min-height: 100vh;
      background: rgba(255,255,255,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(5px);
      border-radius: 18px;
      padding: 32px 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.14);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .muted {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 15px;
    }

    .status {
      margin: 18px auto;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--ok-bg);
      color: var(--ok-text);
      font-size: 14px;
      max-width: 520px;
    }

    .status.error {
      background: var(--err-bg);
      color: var(--err-text);
    }

    .userbox {
      margin: 14px auto 6px;
      font-size: 14px;
      color: #374151;
      max-width: 520px;
      word-break: break-word;
    }

    .hidden {
      display: none !important;
    }

    .button-row {
      margin-top: 18px;
    }

    .btn {
      display: inline-block;
      width: 280px;
      max-width: 100%;
      padding: 12px 16px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn.secondary {
      background: var(--secondary);
    }

    .btn.secondary:hover {
      background: var(--secondary-hover);
    }

    .tools {
      margin-top: 26px;
    }

    .tool-link {
      display: block;
      width: 280px;
      max-width: 100%;
      margin: 10px auto;
      padding: 13px 16px;
      background: var(--tool);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      transition: background 0.15s ease;
    }

    .tool-link:hover {
      background: var(--tool-hover);
    }

    .footer-note {
      margin-top: 22px;
      font-size: 12px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .card {
        padding: 24px 16px;
      }

      h1 {
        font-size: 24px;
      }

      .btn,
      .tool-link {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="wrap">
      <div class="card">
        <h1>Tool-Hub</h1>
        <div class="muted">Microsoft-Login mit Benutzerprüfung</div>

        <div id="status" class="status">Initialisiere Anmeldung...</div>

        <div class="button-row">
          <button id="loginBtn" class="btn">Mit Microsoft anmelden</button>
          <button id="logoutBtn" class="btn secondary hidden">Abmelden</button>
        </div>

        <div id="userInfo" class="userbox hidden"></div>

        <div id="tools" class="tools hidden">
          <a href="seite1.html" class="tool-link">Schichttausch</a>
          <a href="seite2.html" class="tool-link">Statistik</a>
          <a href="vorlagen.html" class="tool-link">Vorlagen</a>
        </div>

        <div class="footer-note">
          Zugriff nur für freigegebene Microsoft-Konten
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
