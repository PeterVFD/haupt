<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meine Startseite</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url("HUB.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      min-height: 100vh;
    }

    .overlay {
      background: rgba(255, 255, 255, 0.75);
      min-height: 100vh;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 10px;
      margin-bottom: 25px;
      color: #1f2937;
      font-size: 32px;
    }

    .container {
      width: 320px;
      max-width: 100%;
      margin: 0 auto;
    }

    .btn {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      background: #0066cc;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      box-sizing: border-box;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .btn:hover {
      background: #004c99;
    }

    .btn-secondary {
      background: #6b7280;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .btn-danger {
      background: #b42318;
    }

    .btn-danger:hover {
      background: #8f1d13;
    }

    .status-box {
      margin-top: 20px;
      background: rgba(255,255,255,0.9);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      color: #374151;
      min-height: 20px;
      word-break: break-word;
    }

    .info-box {
      margin-top: 15px;
      background: rgba(255,255,255,0.9);
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      color: #374151;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Meine Helfer-Seiten</h1>

    <div class="container">
      <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/Briefe/', 'briefe')">schreibe Briefe</button>
      <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/Tarif/', 'tarif')">Checke den Tarif</button>
      <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/Kosten/', 'kosten')">Zahlungs-Aufstellung</button>
      <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/Gehalt/', 'gehalt')">berechne Dein Gehalt</button>
      <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/Schicht/', 'schicht')">Abbau/Split/Tausch</button>
      <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/Pflicht/', 'pflicht')">errechne Deine Präsenz</button>
      <button class="btn" onclick="openProtectedPage('https://petervfd.github.io/TA_SU/', 'ta_su')">TA-Suche</button>

      <button class="btn btn-secondary" onclick="showSessionInfo()">aktive Freigaben anzeigen</button>
      <button class="btn btn-danger" onclick="resetSession()">Freigaben zurücksetzen</button>

      <div class="status-box" id="status">Keine aktiven Freigaben vorhanden.</div>

      <div class="info-box">
        Zugriff auf die Unterseiten soll nur über diese Hub-Seite erfolgen.<br>
        Die Freigabe gilt pro Seite für 15 Minuten.
      </div>
    </div>
  </div>

  <script>
    const ACCESS_KEY = "vf2026";
    const SESSION_MINUTES = 15;
    const STORAGE_KEY = "hubProtectedAccess";

    function loadAccessData() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch (e) {
        return {};
      }
    }

    function saveAccessData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function cleanupExpired(data) {
      const now = Date.now();
      for (const key in data) {
        if (!data[key] || data[key] < now) {
          delete data[key];
        }
      }
      return data;
    }

    function openProtectedPage(baseUrl, pageId) {
      const now = Date.now();
      const expires = now + SESSION_MINUTES * 60 * 1000;

      let data = loadAccessData();
      data = cleanupExpired(data);
      data[pageId] = expires;
      saveAccessData(data);

      const url = new URL(baseUrl);
      url.searchParams.set("access", ACCESS_KEY);
      url.searchParams.set("page", pageId);

      window.open(url.toString(), "_blank");
      setStatus("Freigabe gesetzt für: " + pageId + " (" + SESSION_MINUTES + " Minuten)");
    }

    function resetSession() {
      localStorage.removeItem(STORAGE_KEY);
      setStatus("Alle Freigaben wurden zurückgesetzt.");
    }

    function showSessionInfo() {
      let data = loadAccessData();
      data = cleanupExpired(data);
      saveAccessData(data);

      const entries = Object.entries(data);
      if (entries.length === 0) {
        setStatus("Keine aktiven Freigaben vorhanden.");
        return;
      }

      const lines = entries.map(([page, expires]) => {
        const dt = new Date(expires);
        return page + " bis " + dt.toLocaleTimeString("de-DE");
      });

      setStatus("Aktive Freigaben: " + lines.join(" | "));
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    showSessionInfo();
  </script>
</body>
</html>
